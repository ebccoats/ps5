<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>You're a Bat in a Cave...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="status">No DualSense connected. </p>
    <main id="board"></main>

    <!-- Import audio library (Strudel) -->
    <script src="https://unpkg.com/@strudel/web@1.3.0"></script>
    <script src="audio/audio.js"></script>

    <!-- Import controller & haptics library (PS5) -->
    <script src="controller/dualsense.js"></script>
    <script src="controller/dualsense-connection.js"></script>
    <script src="controller/haptics.js"></script>

    <!-- Import graphics library (P5.js) for debugging only! -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    <script src="rendering/graphics.js"></script>

    <!-- Import gameplay scripts -->
    <script src="game/board.js"></script>
    <script src="game/player.js"></script>
    <script src="index.js" defer></script> <!-- Only load this after DOM content loaded -->
</body>
</html>
