<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>You're a Bat in a Cave...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="status">
        No DualSense connected. To connect your controller:<br>
        1. Press the "PS" button on your controller until it pairs via Bluetooth.<br>
        2. <button id="connect">Click here to connect controller to game.</button>
    </p>
    <main id="board"></main>

    <!-- Import audio library (Strudel) -->
    <script src="https://unpkg.com/@strudel/web@1.3.0"></script>

    <!-- Import graphics library (P5.js) for debugging only! -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>

    <!-- Main game loop -->
    <script type="module" src="dist-js/index.js" defer></script>
</body>
</html>
